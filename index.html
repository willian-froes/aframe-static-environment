<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>A-Frame Playground</title>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    </head>
    <body>
        <!-- PRIMITIVES -->
        <!-- <a-scene>
            <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
            <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
            <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
            <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
            <a-sky color="#ECECEC"></a-sky>
        </a-scene> -->

        <!-- LOAD LOCAL OBJECT -->
        <a-scene physics="debug: true">
            <a-assets>
                <a-asset-item id="green_hill" src="./assets/green_hill_low_poly/scene.gltf"></a-asset-item>  
            </a-assets>

            <a-entity gltf-model="#green_hill" position="0 0 -3" scale="1 1 1" static-body="shape: mesh"></a-entity>
            <a-box position="0 2 -3" width="40" height="1" depth="40" visible="false" static-body></a-box>

            <a-entity id="player" position="0 5 0" dynamic-body="shape: sphere; sphereRadius: 0.5; angularFactor: 0 1 0;">
                <a-camera position="0 1.6 0" look-controls></a-camera>
            </a-entity>
        </a-scene>
    </body>
</html>
